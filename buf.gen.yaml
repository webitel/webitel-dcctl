version: v2
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: gen/go
    opt: module=github.com/webitel/webitel-dcctl/gen/go
  - remote: buf.build/grpc/go:v1.6.1
    out: gen/go
    opt: module=github.com/webitel/webitel-dcctl/gen/go
  - remote: buf.build/grpc-ecosystem/gateway:v2.34.0
    out: gen/go
    opt: module=github.com/webitel/webitel-dcctl/gen/go
  - remote: buf.build/grpc-ecosystem/openapiv2:v2.34.0
    out: api
    opt:
      - allow_merge=true
      - merge_file_name=dcctl
      - json_names_for_fields=false
      - disable_default_errors=true
      - disable_service_tags=false
      - simple_operation_ids=true
      - include_package_in_tags=false
      - version=false
      - expand_slashed_path_patterns=true
      - openapi_naming_strategy=fqn
      - enums_as_ints=false
inputs:
  - directory: proto
