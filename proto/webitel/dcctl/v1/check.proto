syntax = "proto3";

package webitel.dcctl.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/webitel/webitel-dcctl/gen/go/dcctl/v1;dcctlv1";

// Result of one preflight, verify or informational check.
message Check {
  // Check result.
  enum Result {
    // Not set.
    RESULT_UNSPECIFIED = 0;
    // The condition holds.
    PASS = 1;
    // The condition does not hold, or data to evaluate it is missing.
    FAIL = 2;
    // The condition does not hold, the action is not blocked.
    WARN = 3;
    // The check does not apply to the situation.
    SKIP = 4;
  }

  // What a failed check does to the action.
  enum Effect {
    // Informational and verify checks.
    EFFECT_UNSPECIFIED = 0;
    // Failure rejects the action with PREFLIGHT_FAILED.
    BLOCK = 1;
    // Failure is reported as WARN and goes to the operation warnings.
    WARN_ONLY = 2;
    // Failure requires the confirmation named in `confirmation`.
    CONFIRM = 3;
  }

  // Stable check identifier, for example `coord.lock_free`.
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Check result.
  Result result = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Effect of a failure.
  Effect effect = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Confirmation field that accepts the failure, set when effect is CONFIRM:
  // `isolation`, `not_max_lsn` or `max_discard_bytes`.
  string confirmation = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Datacenter the check is about, when it is about one.
  string datacenter = 5 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "dcctl.webitel.com/Datacenter"
  ];

  // Human-readable explanation.
  string detail = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Data the result is based on. Keys depend on the check. Numbers inside
  // are JSON numbers, unlike int64 fields of the API, which are JSON strings.
  google.protobuf.Struct facts = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}
