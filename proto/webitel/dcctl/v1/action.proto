// Request message for DatacenterService.SwitchDatacenter.
message SwitchDatacenterRequest {
  // Datacenter to switch to: `datacenters/{datacenter}`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "dcctl.webitel.com/Datacenter",
    (buf.validate.field).string.pattern = "^datacenters/[A-Za-z0-9_-]{1,63}$"
  ];

  // Confirmations. Switch needs none.
  Confirmation confirmation = 2 [(google.api.field_behavior) = OPTIONAL];

  // Run the preflight only and return the plan.
  bool validate_only = 3 [(google.api.field_behavior) = OPTIONAL];

  // Idempotency key, UUID v4. A repeat with the same body returns the
  // existing operation; with another body it fails with REQUEST_ID_MISMATCH.
  string request_id = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_info).format = UUID4,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {format: "uuid"},
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

