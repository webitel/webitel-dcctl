syntax = "proto3";

package webitel.dcctl.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "webitel/dcctl/v1/journal.proto";

option go_package = "github.com/webitel/webitel-dcctl/gen/go/dcctl/v1;dcctlv1";

// Journal of operations, system actions and alarms.
// (-- api-linter: core::0121::resource-must-support-get=disabled
//     aip.dev/not-precedent: journal entries are only listed. --)
service JournalService {
  // Lists journal entries from newest to oldest.
  rpc ListJournalEntries(ListJournalEntriesRequest) returns (ListJournalEntriesResponse) {
    option (google.api.http) = {get: "/v1/journalEntries"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "200"
        value: {
          description: "Entries, newest first."
          examples: {
            key: "application/json"
            value:
              '{"journal_entries":[{"name":"journalEntries/20261123101501000000000-5c1e9a2b",'
              '"create_time":"2026-11-23T10:15:01Z","type":"OPERATION","initiator":{"user":"support",'
              '"address":"10.1.0.15","instance":{"node":"dcctl-a1","datacenter":"datacenters/dc_a",'
              '"address":"10.1.0.81:10023"}},"datacenter":"datacenters/dc_b","operation":"operations/0b9f3c2e-5d1a-4c55-9a7e-2f4d8c1b6a10",'
              '"operation_type":"SWITCH","params":{"name":"datacenters/dc_b","mode":"QUORUM",'
              '"previous_generation":7,"new_generation":8},"result":"OK","detail":"switch to dc_b started"},'
              '{"name":"journalEntries/20261123101240000000000-a91c03d7","create_time":"2026-11-23T10:12:40Z",'
              '"type":"ALARM","initiator":{"instance":{"node":"dcctl-a1","datacenter":"datacenters/dc_a",'
              '"address":"10.1.0.81:10023"},"system":true},"alarm_type":"VOTER_UNREACHABLE",'
              '"result":"WARNING","detail":"arbiter does not answer"},{"name":"journalEntries/20261122080512000000000-e40b71c9",'
              '"create_time":"2026-11-22T08:05:12Z","type":"SYSTEM","initiator":{"instance":{"node":"dcctl-a1",'
              '"datacenter":"datacenters/dc_a","address":"10.1.0.81:10023"},"system":true},'
              '"datacenter":"datacenters/dc_a","system_action":"FENCE_APPS","params":{"jobs":["webitel-core-api",'
              '"opensips"]},"result":"OK","detail":"stopped 2 managed jobs: the effective state names dc_b as active"}],'
              '"next_page_token":"MjAyNjExMjIwODA1MTIwMDAwMDAwMDAtZTQwYjcxYzl8ZTNiMGM0NDI5OGZjMWMxNA"}'
          }
        }
      }
      responses: {
        key: "400"
        value: {
          description: "Invalid request: `dcctl.request.invalid`."
          schema: {
            json_schema: {ref: ".webitel.dcctl.v1.Error"}
          }
          examples: {
            key: "application/json"
            value:
              '{"id":"dcctl.request.invalid","code":400,"status":"Bad Request","detail":"invalid request",'
              '"violations":[{"type":"field","subject":"page_size",'
              '"description":"must be greater than or equal to 0 and less than or equal to 500"}]}'
          }
        }
      }
      responses: {
        key: "503"
        value: {
          description: "No datacenter answers: `dcctl.kv.unavailable`."
          schema: {
            json_schema: {ref: ".webitel.dcctl.v1.Error"}
          }
          examples: {
            key: "application/json"
            value:
              '{"id":"dcctl.kv.unavailable","code":503,"status":"Service Unavailable",'
              '"detail":"the journal is not readable: no datacenter answers",'
              '"metadata":{"datacenters":"dc_a,dc_b"}}'
          }
        }
      }
    };
  }
}

// Request message for JournalService.ListJournalEntries.
message ListJournalEntriesRequest {
  // Maximum number of entries to return. Default 50, maximum 500.
  int32 page_size = 1 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 500
    }
  ];

  // Page token from a previous response. The other request fields must be
  // the same as in the request that returned it.
  string page_token = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.max_len = 1024
  ];

  // AIP-160 filter on `type`, `datacenter` and `operation`, for example
  // `type = "ALARM" AND datacenter = "datacenters/dc_b"`.
  string filter = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.max_len = 1024
  ];
}

// Response message for JournalService.ListJournalEntries.
message ListJournalEntriesResponse {
  // Entries from newest to oldest.
  repeated JournalEntry journal_entries = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Token of the next page. Empty on the last page.
  string next_page_token = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Datacenters whose journal could not be read, as
  // `datacenters/{datacenter}`: entries of these datacenters may be missing
  // from the response.
  repeated string unreachable = 3 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "dcctl.webitel.com/Datacenter"
  ];
}
