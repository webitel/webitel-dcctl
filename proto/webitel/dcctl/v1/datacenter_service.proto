syntax = "proto3";

package webitel.dcctl.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "webitel/dcctl/v1/action.proto";
import "webitel/dcctl/v1/datacenter.proto";
import "webitel/dcctl/v1/operation.proto";

option go_package = "github.com/webitel/webitel-dcctl/gen/go/dcctl/v1;dcctlv1";

// Datacenters and the actions on them. Every action creates an operation and
// returns it; with validate_only it returns the checks and the plan without
// creating anything, or the error the real request would get. An action on a
// datacenter that is not in the config fails with NOT_FOUND, reason
// DATACENTER_NOT_FOUND, before any check runs.
service DatacenterService {
  // Lists all datacenters in one page.
  rpc ListDatacenters(ListDatacentersRequest) returns (ListDatacentersResponse) {
    option (google.api.http) = {get: "/v1/datacenters"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "200"
        value: {
          description: "All datacenters."
          examples: {
            key: "application/json"
            value:
              '{"datacenters":[{"name":"datacenters/dc_a","state":"ACTIVE","health":"OK",'
              '"sources":[{"system":"CONSUL","endpoint":"10.1.0.89:8500","reachable":true,'
              '"observe_time":"2026-11-23T10:14:55Z"},{"system":"NOMAD","endpoint":"https://10.1.0.91:4646",'
              '"reachable":true,"observe_time":"2026-11-23T10:14:55Z"},{"system":"PATRONI",'
              '"endpoint":"https://10.1.0.95:8008","reachable":true,"observe_time":"2026-11-23T10:14:55Z"}],'
              '"patroni":{"leader":"pg-a1","role":"PRIMARY","timeline":"5"},"nomad":{"leader":"10.1.0.91:4647",'
              '"ready_node_count":3,"job_counts":{"healthy_count":12}}},{"name":"datacenters/dc_b",'
              '"state":"STANDBY","health":"OK","sources":[{"system":"CONSUL","endpoint":"10.2.0.89:8500",'
              '"reachable":true,"observe_time":"2026-11-23T10:14:55Z"},{"system":"NOMAD",'
              '"endpoint":"https://10.2.0.91:4646","reachable":true,"observe_time":"2026-11-23T10:14:55Z"},'
              '{"system":"PATRONI","endpoint":"https://10.2.0.95:8008","reachable":true,'
              '"observe_time":"2026-11-23T10:14:55Z"}],"patroni":{"leader":"pg-b1","role":"STANDBY_LEADER",'
              '"timeline":"5","standby_cluster_host":"10.1.0.95","upstream_datacenter":"datacenters/dc_a",'
              '"lag_bytes":"0","divergence_state":"NOT_DIVERGED"},"nomad":{"leader":"10.2.0.91:4647","ready_node_count":3,'
              '"job_counts":{"stopped_count":12}}}]}'
          }
        }
      }
      responses: {
        key: "400"
        value: {
          description: "Invalid request: `dcctl.request.invalid`."
          schema: {
            json_schema: {ref: ".webitel.dcctl.v1.Error"}
          }
          examples: {
            key: "application/json"
            value:
              '{"id":"dcctl.request.invalid","code":400,"status":"Bad Request","detail":"invalid request",'
              '"violations":[{"type":"field","subject":"page_size",'
              '"description":"must be greater than or equal to 0 and less than or equal to 500"}]}'
          }
        }
      }
      responses: {
        key: "503"
        value: {
          description: "No collection cycle has finished yet: `dcctl.status.not_ready`."
          schema: {
            json_schema: {ref: ".webitel.dcctl.v1.Error"}
          }
          examples: {
            key: "application/json"
            value:
              '{"id":"dcctl.status.not_ready","code":503,"status":"Service Unavailable",'
              '"detail":"no collection cycle has finished yet"}'
          }
        }
      }
    };
  }

  // Returns the datacenter details as seen by the instance that answers.
  rpc GetDatacenter(GetDatacenterRequest) returns (Datacenter) {
    option (google.api.http) = {get: "/v1/{name=datacenters/*}"};
    option (google.api.method_signature) = "name";
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "200"
        value: {
          description: "Datacenter details."
          examples: {
            key: "application/json"
            value:
              '{"name":"datacenters/dc_b","state":"STANDBY","health":"OK","sources":[{"system":"CONSUL",'
              '"endpoint":"10.2.0.89:8500","reachable":true,"observe_time":"2026-11-23T10:14:55Z"},'
              '{"system":"NOMAD","endpoint":"https://10.2.0.91:4646","reachable":true,'
              '"observe_time":"2026-11-23T10:14:55Z"},{"system":"PATRONI","endpoint":"https://10.2.0.95:8008",'
              '"reachable":true,"observe_time":"2026-11-23T10:14:55Z"}],"patroni":{"leader":"pg-b1",'
              '"role":"STANDBY_LEADER","timeline":"5","standby_cluster_host":"10.1.0.95",'
              '"upstream_datacenter":"datacenters/dc_a","lag_bytes":"0","divergence_state":"NOT_DIVERGED",'
              '"members":[{"member":"pg-b1",'
              '"host":"10.2.0.95","api_uri":"https://10.2.0.95:8008","reachable":true,'
              '"role":"STANDBY_LEADER","patroni_state":"streaming","timeline":"5","replication_state":"streaming",'
              '"xlog":{"received_location":"83886176","replayed_location":"83886176",'
              '"replay_time":"2026-11-23T10:14:54Z"},"version":"4.1.0",'
              '"usable":true},{"member":"pg-b2","host":"10.2.0.96","api_uri":"https://10.2.0.96:8008",'
              '"reachable":true,"role":"REPLICA","patroni_state":"streaming","timeline":"5",'
              '"replication_state":"streaming","xlog":{"received_location":"83886176",'
              '"replayed_location":"83886176","replay_time":"2026-11-23T10:14:54Z"},"lag_bytes":"0",'
              '"version":"4.1.0","usable":true}]},"nomad":{"leader":"10.2.0.91:4647",'
              '"ready_node_count":3,"job_counts":{"stopped_count":2},"stages":[{"stage":1,'
              '"job_counts":{"stopped_count":1},"jobs":[{"job":"freeswitch","stage":1,'
              '"type":"SYSTEM","stop":true,"state":"STOPPED","allocation_counts":{"complete":3},'
              '"modify_index":"4182","expected_node_count":3}]},{"stage":3,"job_counts":{"stopped_count":1},'
              '"jobs":[{"job":"webitel-core-api","stage":3,"type":"SERVICE","stop":true,'
              '"state":"STOPPED","allocation_counts":{"complete":2},"modify_index":"4190"}]}],'
              '"unmanaged_jobs":[{"job":"node-exporter","nomad_status":"running"}]},"observer":{"node":"dcctl-a1",'
              '"datacenter":"datacenters/dc_a","address":"10.1.0.81:10023"},"observe_time":"2026-11-23T10:14:55Z",'
              '"info_checks":[{"id":"info.rabbitmq","result":"PASS","datacenter":"datacenters/dc_b",'
              '"detail":"rabbitmq: 3 of 3 passing","facts":{"service":"rabbitmq","passing":3,'
              '"total":3}}]}'
          }
        }
      }
      responses: {
        key: "404"
        value: {
          description: "The datacenter is not in the config: `dcctl.datacenter.not_found`."
          schema: {
            json_schema: {ref: ".webitel.dcctl.v1.Error"}
          }
          examples: {
            key: "application/json"
            value:
              '{"id":"dcctl.datacenter.not_found","code":404,"status":"Not Found","detail":"datacenter dc_c not found",'
              '"metadata":{"datacenter":"datacenters/dc_c"}}'
          }
        }
      }
      responses: {
        key: "400"
        value: {
          description: "Invalid request: `dcctl.request.invalid`."
          schema: {
            json_schema: {ref: ".webitel.dcctl.v1.Error"}
          }
          examples: {
            key: "application/json"
            value:
              '{"id":"dcctl.request.invalid","code":400,"status":"Bad Request","detail":"invalid request",'
              '"violations":[{"type":"field","subject":"name",'
              '"description":"does not match regex pattern `^datacenters/[A-Za-z0-9_-]{1,63}$`"}]}'
          }
        }
      }
      responses: {
        key: "503"
        value: {
          description: "No collection cycle has finished yet: `dcctl.status.not_ready`."
          schema: {
            json_schema: {ref: ".webitel.dcctl.v1.Error"}
          }
          examples: {
            key: "application/json"
            value:
              '{"id":"dcctl.status.not_ready","code":503,"status":"Service Unavailable",'
              '"detail":"no collection cycle has finished yet"}'
          }
        }
      }
    };
  }

  // Planned switch of the active datacenter to this one.
  // (-- api-linter: core::0136::response-message-name=disabled
  //     aip.dev/not-precedent: actions return the own Operation resource
  //     instead of google.longrunning.Operation. --)
  rpc SwitchDatacenter(SwitchDatacenterRequest) returns (Operation) {
    option (google.api.http) = {
      post: "/v1/{name=datacenters/*}:switch"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "200"
        value: {
          description: "The operation: started, or the existing one for the same request_id. With validate_only, the checks and the plan of the operation that would start, with an empty name."
          examples: {
            key: "application/json"
            value:
              '{"name":"operations/0b9f3c2e-5d1a-4c55-9a7e-2f4d8c1b6a10","type":"SWITCH","state":"RUNNING",'
              '"target":"datacenters/dc_b","initiator":{"user":"support","address":"10.1.0.15",'
              '"instance":{"node":"dcctl-a1","datacenter":"datacenters/dc_a","address":"10.1.0.81:10023"}},'
              '"leader":{"node":"dcctl-b1","datacenter":"datacenters/dc_b","address":"10.2.0.81:10023"},'
              '"mode":"QUORUM","previous_generation":"7","new_generation":"8",'
              '"checks":[{"id":"coord.lock_free","result":"PASS","effect":"BLOCK","detail":"the lock is free",'
              '"facts":{"unreachable":[]}},{"id":"patroni.target_lag","result":"PASS","effect":"BLOCK",'
              '"datacenter":"datacenters/dc_b","detail":"dc_b lags 0 bytes","facts":{"lag_bytes":0,'
              '"limit_bytes":1048576}}],"steps":[{"type":"APPS_PREFLIGHT","state":"SUCCEEDED",'
              '"start_time":"2026-11-23T10:15:02Z","end_time":"2026-11-23T10:15:04Z"},{"index":1,'
              '"type":"APPS_STOP","stage":3,"datacenter":"datacenters/dc_a","state":"RUNNING",'
              '"start_time":"2026-11-23T10:15:04Z","detail":"stopping 1 of 3 jobs"},{"index":2,'
              '"type":"PATRONI_DEMOTE","datacenter":"datacenters/dc_a","state":"PENDING"},{"index":3,'
              '"type":"GENERATION","state":"PENDING","point_of_no_return":true}],'
              '"request_id":"6f1c2b9e-8d4a-4f3b-9c2e-1a7d5e3f9b40","create_time":"2026-11-23T10:15:01Z",'
              '"update_time":"2026-11-23T10:15:04Z","switch_datacenter":{"name":"datacenters/dc_b",'
              '"request_id":"6f1c2b9e-8d4a-4f3b-9c2e-1a7d5e3f9b40"}}'
          }
        }
      }
      responses: {
        key: "400"
        value: {
          description: "Rejected: `dcctl.request.invalid`, `dcctl.preflight.failed`, `dcctl.confirmation.required`, `dcctl.operation.running`."
          schema: {
            json_schema: {ref: ".webitel.dcctl.v1.Error"}
          }
          examples: {
            key: "application/json"
            value:
              '{"id":"dcctl.preflight.failed","code":400,"status":"Bad Request",'
              '"detail":"preflight failed: patroni.target_lag","violations":[{"type":"check",'
              '"subject":"patroni.target_lag","description":"dc_b lags 52428800 bytes, more than 1048576"}],'
              '"preflight":{"mode":"QUORUM","checks":[{"id":"coord.lock_free","result":"PASS","effect":"BLOCK",'
              '"detail":"the lock is free","facts":{"unreachable":[]}},{"id":"patroni.target_lag",'
              '"result":"FAIL","effect":"BLOCK","datacenter":"datacenters/dc_b",'
              '"detail":"dc_b lags 52428800 bytes, more than 1048576","facts":{"lag_bytes":52428800,'
              '"limit_bytes":1048576}}],"steps":[{"type":"APPS_PREFLIGHT","state":"PENDING"}]}}'
          }
        }
      }
      responses: {
        key: "404"
        value: {
          description: "The datacenter is not in the config: `dcctl.datacenter.not_found`."
          schema: {
            json_schema: {ref: ".webitel.dcctl.v1.Error"}
          }
          examples: {
            key: "application/json"
            value:
              '{"id":"dcctl.datacenter.not_found","code":404,"status":"Not Found","detail":"datacenter dc_c is not in the config",'
              '"metadata":{"datacenter":"datacenters/dc_c"}}'
          }
        }
      }
      responses: {
        key: "409"
        value: {
          description: "Conflict: `dcctl.lock.busy`, `dcctl.request_id.mismatch`."
          schema: {
            json_schema: {ref: ".webitel.dcctl.v1.Error"}
          }
          examples: {
            key: "application/json"
            value:
              '{"id":"dcctl.lock.busy","code":409,"status":"Conflict",'
              '"detail":"dcctl/lock in dc_a is held by instance dcctl-b1 of dc_b for operation 0b9f3c2e-5d1a-4c55-9a7e-2f4d8c1b6a10",'
              '"metadata":{"holder":"dcctl-b1","datacenter":"datacenters/dc_b",'
              '"operation":"operations/0b9f3c2e-5d1a-4c55-9a7e-2f4d8c1b6a10"}}'
          }
        }
      }
      responses: {
        key: "503"
        value: {
          description: "The leading instance is unreachable (`dcctl.leader.unavailable`), or no Consul KV answered to take dcctl/lock (`dcctl.lock.unavailable`)."
          schema: {
            json_schema: {ref: ".webitel.dcctl.v1.Error"}
          }
          examples: {
            key: "application/json"
            value:
              '{"id":"dcctl.leader.unavailable","code":503,"status":"Service Unavailable",'
              '"detail":"the leading instance is critical in Consul","metadata":{"instance":"dcctl-b1"}}'
          }
        }
      }
    };
  }

  // Failover to this datacenter when the active one is lost.
  // (-- api-linter: core::0136::response-message-name=disabled
  //     aip.dev/not-precedent: actions return the own Operation resource
  //     instead of google.longrunning.Operation. --)
  rpc FailoverDatacenter(FailoverDatacenterRequest) returns (Operation) {
    option (google.api.http) = {
      post: "/v1/{name=datacenters/*}:failover"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "200"
        value: {description: "The operation: started, or the existing one for the same request_id. With validate_only, the checks and the plan of the operation that would start, with an empty name."}
      }
      responses: {
        key: "400"
        value: {
          description: "Rejected: `dcctl.request.invalid`, `dcctl.preflight.failed`, `dcctl.confirmation.required`, `dcctl.operation.running`."
          schema: {
            json_schema: {ref: ".webitel.dcctl.v1.Error"}
          }
          examples: {
            key: "application/json"
            value:
              '{"id":"dcctl.confirmation.required","code":400,"status":"Bad Request",'
              '"detail":"confirmation required: isolation","violations":[{"type":"confirmation",'
              '"subject":"isolation","description":"the old primary must be isolated"}],'
              '"preflight":{"mode":"FORCED","checks":[{"id":"coord.isolation","result":"FAIL",'
              '"effect":"CONFIRM","confirmation":"isolation","detail":"the old primary must be isolated",'
              '"facts":{"mode":"forced_only","voters":[{"name":"dc_a","reachable":false},{"name":"dc_b",'
              '"reachable":true,"generation":7,"active_datacenter":"dc_a"},{"name":"arbiter",'
              '"reachable":false}],"datacenters":[{"datacenter":"dc_a","patroni_reachable":false,'
              '"last_seen":{"time":"2026-11-23T10:01:58Z","member":"pg-a1","role":"primary",'
              '"xlog_location":83886176}}]}}],"steps":[{"type":"GENERATION","state":"PENDING",'
              '"point_of_no_return":true},{"index":1,"type":"PATRONI_PROMOTE","datacenter":"datacenters/dc_b",'
              '"state":"PENDING"}]}}'
          }
        }
      }
      responses: {
        key: "404"
        value: {
          description: "The datacenter is not in the config: `dcctl.datacenter.not_found`."
          schema: {
            json_schema: {ref: ".webitel.dcctl.v1.Error"}
          }
          examples: {
            key: "application/json"
            value:
              '{"id":"dcctl.datacenter.not_found","code":404,"status":"Not Found","detail":"datacenter dc_c is not in the config",'
              '"metadata":{"datacenter":"datacenters/dc_c"}}'
          }
        }
      }
      responses: {
        key: "409"
        value: {
          description: "Conflict: `dcctl.lock.busy`, `dcctl.request_id.mismatch`."
          schema: {
            json_schema: {ref: ".webitel.dcctl.v1.Error"}
          }
          examples: {
            key: "application/json"
            value:
              '{"id":"dcctl.request_id.mismatch","code":409,"status":"Conflict","detail":"request_id was used with another body",'
              '"metadata":{"operation":"operations/0b9f3c2e-5d1a-4c55-9a7e-2f4d8c1b6a10"}}'
          }
        }
      }
      responses: {
        key: "503"
        value: {
          description: "The leading instance is unreachable (`dcctl.leader.unavailable`), or no Consul KV answered to take dcctl/lock (`dcctl.lock.unavailable`)."
          schema: {
            json_schema: {ref: ".webitel.dcctl.v1.Error"}
          }
          examples: {
            key: "application/json"
            value:
              '{"id":"dcctl.lock.unavailable","code":503,"status":"Service Unavailable",'
              '"detail":"dcctl/lock not taken: no kv answered (dc_a, dc_b)","metadata":{"datacenters":"dc_a,dc_b"}}'
          }
        }
      }
    };
  }

  // Demotes the old primary of this datacenter and points it at the active
  // one. Clears the db_split alarm.
  // (-- api-linter: core::0136::response-message-name=disabled
  //     aip.dev/not-precedent: actions return the own Operation resource
  //     instead of google.longrunning.Operation. --)
  rpc DemoteDatacenter(DemoteDatacenterRequest) returns (Operation) {
    option (google.api.http) = {
      post: "/v1/{name=datacenters/*}:demote"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "200"
        value: {description: "The operation: started, or the existing one for the same request_id. With validate_only, the checks and the plan of the operation that would start, with an empty name."}
      }
      responses: {
        key: "400"
        value: {
          description: "Rejected: `dcctl.request.invalid`, `dcctl.preflight.failed`, `dcctl.confirmation.required`, `dcctl.operation.running`."
          schema: {
            json_schema: {ref: ".webitel.dcctl.v1.Error"}
          }
          examples: {
            key: "application/json"
            value:
              '{"id":"dcctl.operation.running","code":400,"status":"Bad Request",'
              '"detail":"operation operations/0b9f3c2e-5d1a-4c55-9a7e-2f4d8c1b6a10 is running",'
              '"metadata":{"operation":"operations/0b9f3c2e-5d1a-4c55-9a7e-2f4d8c1b6a10"}}'
          }
        }
      }
      responses: {
        key: "404"
        value: {
          description: "The datacenter is not in the config: `dcctl.datacenter.not_found`."
          schema: {
            json_schema: {ref: ".webitel.dcctl.v1.Error"}
          }
          examples: {
            key: "application/json"
            value:
              '{"id":"dcctl.datacenter.not_found","code":404,"status":"Not Found","detail":"datacenter dc_c is not in the config",'
              '"metadata":{"datacenter":"datacenters/dc_c"}}'
          }
        }
      }
      responses: {
        key: "409"
        value: {
          description: "Conflict: `dcctl.lock.busy`, `dcctl.request_id.mismatch`."
          schema: {
            json_schema: {ref: ".webitel.dcctl.v1.Error"}
          }
          examples: {
            key: "application/json"
            value:
              '{"id":"dcctl.lock.busy","code":409,"status":"Conflict",'
              '"detail":"dcctl/lock in dc_a is held by instance dcctl-b1 of dc_b for operation 0b9f3c2e-5d1a-4c55-9a7e-2f4d8c1b6a10",'
              '"metadata":{"holder":"dcctl-b1","datacenter":"datacenters/dc_b",'
              '"operation":"operations/0b9f3c2e-5d1a-4c55-9a7e-2f4d8c1b6a10"}}'
          }
        }
      }
      responses: {
        key: "503"
        value: {
          description: "The leading instance is unreachable (`dcctl.leader.unavailable`), or no Consul KV answered to take dcctl/lock (`dcctl.lock.unavailable`)."
          schema: {
            json_schema: {ref: ".webitel.dcctl.v1.Error"}
          }
          examples: {
            key: "application/json"
            value:
              '{"id":"dcctl.leader.unavailable","code":503,"status":"Service Unavailable",'
              '"detail":"the leading instance is critical in Consul","metadata":{"instance":"dcctl-b1"}}'
          }
        }
      }
    };
  }

  // Points this standby datacenter at the active one.
  // (-- api-linter: core::0136::response-message-name=disabled
  //     aip.dev/not-precedent: actions return the own Operation resource
  //     instead of google.longrunning.Operation. --)
  rpc RepointDatacenter(RepointDatacenterRequest) returns (Operation) {
    option (google.api.http) = {
      post: "/v1/{name=datacenters/*}:repoint"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "200"
        value: {
          description: "The operation: started, or the existing one for the same request_id. With validate_only, the checks and the plan of the operation that would start, with an empty name."
          examples: {
            key: "application/json"
            value:
              '{"type":"REPOINT","target":"datacenters/dc_b","mode":"QUORUM","checks":[{"id":"coord.lock_free",'
              '"result":"PASS","effect":"BLOCK","detail":"the lock is free","facts":{"unreachable":[]}},'
              '{"id":"patroni.divergence","result":"PASS","effect":"CONFIRM",'
              '"confirmation":"max_discard_bytes","datacenter":"datacenters/dc_b",'
              '"detail":"dc_b did not diverge from the active datacenter","facts":{"known":true,'
              '"diverged":false,"timeline":5,"xlog_location":"0/5000060"}}],"steps":[{"type":"PATRONI_REPOINT",'
              '"datacenter":"datacenters/dc_b","state":"PENDING"},{"index":1,"type":"PATRONI_FOLLOW",'
              '"datacenter":"datacenters/dc_b","state":"PENDING"}]}'
          }
        }
      }
      responses: {
        key: "400"
        value: {
          description: "Rejected: `dcctl.request.invalid`, `dcctl.preflight.failed`, `dcctl.confirmation.required`, `dcctl.operation.running`."
          schema: {
            json_schema: {ref: ".webitel.dcctl.v1.Error"}
          }
          examples: {
            key: "application/json"
            value:
              '{"id":"dcctl.confirmation.required","code":400,"status":"Bad Request",'
              '"detail":"confirmation required: max_discard_bytes","violations":[{"type":"confirmation",'
              '"subject":"max_discard_bytes","description":"dc_b diverged,'
              ' a rewind discards 1048576 bytes; max_discard_bytes must be at least 1048576"}],'
              '"preflight":{"mode":"QUORUM","checks":[{"id":"patroni.divergence","result":"FAIL",'
              '"effect":"CONFIRM","confirmation":"max_discard_bytes","datacenter":"datacenters/dc_b",'
