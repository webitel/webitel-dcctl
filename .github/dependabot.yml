version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

    ignore:
      - dependency-name: "webitel/reusable-workflows"
      - dependency-name: "webitel/reusable-workflows/*"

    groups:
      minor-and-patch:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]
    cooldown:
      default-days: 3

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"

    allow: [ dependency-type: "direct" ]
    open-pull-requests-limit: 5
    labels: [ "dependencies", "go" ]
    groups:
      minor-and-patch:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]
    cooldown:
      default-days: 3
      semver-major-days: 14
    commit-message:
      include: scope
      prefix: "chore"

  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"

    ignore:
      # @webitel/* packages follow the product release line.
      - dependency-name: "@webitel/*"
        update-types: [ "version-update:semver-major", "version-update:semver-minor" ]
      # @webitel/ui-sdk pins these majors.
      - dependency-name: "pinia"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "vue-router"
        update-types: [ "version-update:semver-major" ]
      # Follows the Node version in ui/.nvmrc.
      - dependency-name: "@types/node"
        update-types: [ "version-update:semver-major" ]
      # vue-tsc supports TypeScript up to 6.
      - dependency-name: "typescript"
        versions: [ ">=7" ]

    allow: [ dependency-type: "direct" ]
    open-pull-requests-limit: 5
    labels: [ "dependencies", "ui" ]
    groups:
      minor-and-patch:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]
    cooldown:
      default-days: 3
      semver-major-days: 14
    commit-message:
      include: scope
      prefix: "chore"
