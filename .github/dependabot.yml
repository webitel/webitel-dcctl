version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

    ignore:
      - dependency-name: "webitel/reusable-workflows"
      - dependency-name: "webitel/reusable-workflows/*"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"

    allow: [ dependency-type: "direct" ]
    open-pull-requests-limit: 5
    labels: [ "dependencies", "go" ]
    commit-message:
      include: scope
      prefix: "chore"

  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"

    # @webitel/* packages follow the product release line.
    ignore:
      - dependency-name: "@webitel/*"
        update-types: [ "version-update:semver-major", "version-update:semver-minor" ]

    allow: [ dependency-type: "direct" ]
    open-pull-requests-limit: 5
    labels: [ "dependencies", "ui" ]
    groups:
      minor-and-patch:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]
    commit-message:
      include: scope
      prefix: "chore"
