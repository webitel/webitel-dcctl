version: v2
modules:
  - path: proto
deps:
  - buf.build/bufbuild/protovalidate
  - buf.build/googleapis/googleapis
  - buf.build/grpc-ecosystem/grpc-gateway
lint:
  use:
    - STANDARD
  except:
    # AIP-131 and AIP-136: Get and custom methods return the resource, not XxxResponse.
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    # AIP-126: enum values are scoped by the nested enum and carry no prefix.
    - ENUM_VALUE_PREFIX
  disallow_comment_ignores: true
breaking:
  use:
    - FILE
